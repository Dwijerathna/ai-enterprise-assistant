version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: ai_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: enterprise_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data



  qdrant:
    image: qdrant/qdrant
    container_name: ai_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage



  



volumes:

  postgres_data:

  qdrant_data:

  